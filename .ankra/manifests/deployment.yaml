apiVersion: v1
kind: ServiceAccount
metadata:
  name: marz
  labels:
    app.kubernetes.io/name: marz
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: marz
  labels:
    app.kubernetes.io/name: marz
  annotations:
    ankra.io/generated: "true"
spec:
  replicas: 1
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: marz
  template:
    metadata:
      labels:
        app.kubernetes.io/name: marz
    spec:
      serviceAccountName: marz
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ankra-registry-pull
      containers:
        - name: marz
          image: registry.ankra.cloud/org-f886a22f-c528-4489-a23a-79b7530c9d98/marz:${{ ankra.image_tag }}
          imagePullPolicy: IfNotPresent
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: ANKRA_RELEASE
              value: "${{ ankra.image_tag }}"
            - name: CF_TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: marz-env
                  key: CF_TUNNEL_TOKEN
                  optional: true
            - name: DOCTOR_TG_CHAT
              valueFrom:
                secretKeyRef:
                  name: marz-env
                  key: DOCTOR_TG_CHAT
                  optional: true
            - name: DOCTOR_TG_TOKEN
              valueFrom:
                secretKeyRef:
                  name: marz-env
                  key: DOCTOR_TG_TOKEN
                  optional: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: 30
            periodSeconds: 2
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: http
            failureThreshold: 5
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: tmp
          emptyDir: {}
